<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory - Kar Mukil Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Kar Mukil</h3>
                <p class="text-muted small">Admin Panel</p>
            </div>
            <ul class="list-unstyled components">
                <li><a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li><a href="products.html"><i class="fas fa-box me-2"></i> Products</a></li>
                <li class="active"><a href="inventory.html"><i class="fas fa-warehouse me-2"></i> Inventory</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart me-2"></i> Orders</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <span class="navbar-brand fw-bold text-primary">Inventory & Production</span>
                    <button class="btn btn-primary ms-auto" data-bs-toggle="modal" data-bs-target="#productionModal">
                        <i class="fas fa-plus"></i> Add Daily Production
                    </button>
                </div>
            </nav>

            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover" id="inventoryTable">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Available Stock</th>
                                <th>Min Stock Level</th>
                                <th>Status</th>
                                <th>Last Updated</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Production Modal -->
    <div class="modal fade" id="productionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">Add Daily Production</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="productionForm">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">Select Product</label>
                            <select class="form-select" id="prodSelect" required></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">Date</label>
                            <input type="date" class="form-control" id="prodDate" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted fw-semibold">Quantity Produced</label>
                            <input type="number" class="form-control" id="prodQty" required min="1">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Add Stock</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth('admin');
            loadInventory();
            document.getElementById('prodDate').valueAsDate = new Date();
            document.getElementById('productionForm').addEventListener('submit', handleProductionSubmit);
        });
    </script>
</body>
</html>
