<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kar Mukil - Batter Distribution Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .brand-icon-lg {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #4f46e5, #0ea5e9);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center mb-4">
            <div class="brand-icon-lg">K</div>
            <h2 class="fw-bold text-dark mb-1">Kar Mukil</h2>
            <p class="text-muted small">Batter, Expense, Profit & Distribution System</p>
        </div>

        <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

        <div class="d-flex gap-2 mb-3">
            <button type="button" class="btn btn-sm btn-outline-primary w-50 fw-semibold active" id="btnAdminTab" onclick="switchDemoUser('admin')">
                <i class="fas fa-user-shield me-1"></i> Admin Login
            </button>
            <button type="button" class="btn btn-sm btn-outline-success w-50 fw-semibold" id="btnShopTab" onclick="switchDemoUser('shop')">
                <i class="fas fa-store me-1"></i> Shop Owner Login
            </button>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" id="email" class="form-control" required value="admin@karmukil.com">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" id="password" class="form-control" required value="admin123">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
                <i class="fas fa-right-to-bracket me-2"></i> Sign In to Kar Mukil
            </button>

            <div class="p-3 bg-light rounded-3 text-center small text-muted">
                <span id="demoText"><strong>Admin Demo Account:</strong><br>Email: <code>admin@karmukil.com</code> | Password: <code>admin123</code></span>
            </div>
            
            <div class="text-center mt-3 small">
                <span class="text-muted">Registering a new retail shop? </span>
                <a href="register.html" class="fw-bold text-primary">Register Here</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        function switchDemoUser(type) {
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            const demoText = document.getElementById('demoText');
            const btnAdmin = document.getElementById('btnAdminTab');
            const btnShop = document.getElementById('btnShopTab');

            if (type === 'admin') {
                emailInput.value = 'admin@karmukil.com';
                passInput.value = 'admin123';
                demoText.innerHTML = '<strong>Admin Demo Account:</strong><br>Email: <code>admin@karmukil.com</code> | Password: <code>admin123</code>';
                btnAdmin.classList.add('active', 'btn-outline-primary');
                btnShop.classList.remove('active');
            } else {
                emailInput.value = 'ramesh@abcsuper.com';
                passInput.value = 'admin123';
                demoText.innerHTML = '<strong>Shop Owner Demo Account:</strong><br>Email: <code>ramesh@abcsuper.com</code> | Password: <code>admin123</code>';
                btnShop.classList.add('active');
                btnAdmin.classList.remove('active');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (token) {
                if (user.role === 'admin') {
                    window.location.href = '/admin/dashboard.html';
                } else {
                    window.location.href = '/shop/dashboard.html';
                }
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('loginAlert');

            try {
                const data = await fetchAPI('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                if (data.user.role === 'admin') {
                    window.location.href = '/admin/dashboard.html';
                } else {
                    window.location.href = '/shop/dashboard.html';
                }
            } catch (error) {
                alertBox.classList.remove('d-none');
                alertBox.textContent = error.message || 'Login failed. Please check credentials.';
            }
        });
    </script>
</body>
</html>
