<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - Kar Mukil Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <h3>Kar Mukil</h3>
                <p class="text-muted small">Admin Panel</p>
            </div>
            <ul class="list-unstyled components">
                <li><a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a></li>
                <li class="active"><a href="products.html"><i class="fas fa-box me-2"></i> Products</a></li>
                <li><a href="inventory.html"><i class="fas fa-warehouse me-2"></i> Inventory</a></li>
                <li><a href="orders.html"><i class="fas fa-shopping-cart me-2"></i> Orders</a></li>
                <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-expand-lg">
                <div class="container-fluid">
                    <span class="navbar-brand fw-bold text-primary">Manage Products</span>
                    <button class="btn btn-primary ms-auto" data-bs-toggle="modal" data-bs-target="#productModal" onclick="document.getElementById('productForm').reset(); document.getElementById('productId').value='';">
                        <i class="fas fa-plus"></i> Add Product
                    </button>
                </div>
            </nav>

            <div class="card p-4">
                <div class="table-responsive">
                    <table class="table table-hover" id="productsTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Unit</th>
                                <th>Price</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-primary">Add/Edit Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-semibold">Product Name</label>
                            <input type="text" class="form-control" id="productName" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-semibold">Price (₹)</label>
                                <input type="number" class="form-control" id="productPrice" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted fw-semibold">Unit (e.g., 1kg)</label>
                                <input type="text" class="form-control" id="productUnit" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted fw-semibold">Description</label>
                            <textarea class="form-control" id="productDesc" rows="2"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Save Product</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth('admin');
            loadProducts();
            document.getElementById('productForm').addEventListener('submit', handleProductSubmit);
        });
    </script>
</body>
</html>
