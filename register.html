<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kar Mukil - Register Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper" style="height: auto; padding: 40px 0;">
        <div class="card auth-card" style="max-width: 600px;">
            <div class="brand-logo mb-4">
                <h1>Kar Mukil</h1>
                <p class="text-muted">Register your shop to order fresh batter</p>
            </div>
            <div id="alertBox" class="alert d-none" role="alert"></div>
            <form id="registerForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Owner Name</label>
                        <input type="text" class="form-control" id="name" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Shop Name</label>
                        <input type="text" class="form-control" id="shop_name" required>
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phone" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Shop Address</label>
                    <textarea class="form-control" id="address" rows="2" required></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Register Shop</button>
                <div class="text-center">
                    <span class="text-muted">Already have an account? </span>
                    <a href="/index.html" class="text-decoration-none" style="color: var(--primary-color);">Login here</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const data = {
                name: document.getElementById('name').value,
                shop_name: document.getElementById('shop_name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                password: document.getElementById('password').value,
                role: 'shop_owner'
            };

            try {
                await fetchAPI('/auth/register', {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                alertBox.classList.remove('d-none');
                alertBox.className = 'alert alert-success';
                alertBox.textContent = 'Registration successful! You can now login.';
                document.getElementById('registerForm').reset();
                setTimeout(() => window.location.href = '/index.html', 2000);
            } catch (error) {
                alertBox.classList.remove('d-none');
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = error.message;
            }
        });
    </script>
</body>
</html>
